<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CRAFT WELL CREATIVE — 만드는 사람을 위한 인터랙티브 포트폴리오. 리듬, 과정, 그리고 더 나은 작업."
    />
    <title>CRAFT WELL CREATIVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      (function () {
        if (/localhost|127\.0\.0\.1/.test(location.hostname)) return
        if (document.querySelector('script[src*="assets/main.js"]')) return
        var link = document.createElement('link')
        link.rel = 'stylesheet'
        link.href = './assets/index.css'
        document.head.appendChild(link)
        var script = document.createElement('script')
        script.type = 'module'
        script.src = './assets/main.js'
        document.body.appendChild(script)
      })()
    </script>
  </body>
